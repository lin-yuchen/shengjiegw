<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a1520">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>货柜门 · 手机版原型</title>
<style>
  :root{
    --dur: 1.45s;
    --angle: 108deg;
    --persp: 2400px;
    --pad-x: 8vw;
    --h1: clamp(1.8rem, 4.2vw, 3.4rem);
    --body: 1rem;
    --hint-bottom: 7%;
  }

  *{box-sizing:border-box}
  html,body{
    margin:0; height:100%; background:#0a1520;
    font-family:'Noto Sans SC','Microsoft JhengHei',-apple-system,BlinkMacSystemFont,sans-serif;
    overflow:hidden; overscroll-behavior:none;
    -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }

  .hero{
    position:relative; height:100vh; height:100dvh;
    overflow:hidden; perspective:var(--persp); perspective-origin:50% 50%;
  }

  /* ---------- 门后的真实内容 ---------- */
  .inside{
    position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center;
    padding:0 var(--pad-x);
    padding-top:calc(env(safe-area-inset-top) + 24px);
    padding-bottom:calc(env(safe-area-inset-bottom) + 24px);
    background:linear-gradient(180deg,rgba(6,18,28,.55),rgba(6,18,28,.85)),
               url('../assets/images/slides/slide-1.webp') center/cover no-repeat;
    color:#fff; transition:transform 1.8s cubic-bezier(.2,.7,.2,1);
  }
  .inside h1{font-size:var(--h1); line-height:1.26; margin:0 0 16px; letter-spacing:-.01em}
  .inside h1 em{font-style:normal; color:#67d7ea}
  .inside p{max-width:620px; font-size:var(--body); color:rgba(255,255,255,.86); line-height:1.75; margin:0 0 24px}
  .btns{display:flex; gap:12px; flex-wrap:wrap}
  .btn{
    display:inline-flex; align-items:center; justify-content:center;
    min-height:48px; padding:0 22px; border-radius:8px;
    background:#00b4d8; color:#04222b; font-weight:700; font-size:1rem;
    text-decoration:none; border:0; -webkit-appearance:none;
  }
  .btn.ghost{background:transparent; color:#fff; border:1px solid rgba(255,255,255,.55)}

  /* ---------- 两扇门：照片沿门缝对切 ---------- */
  .leaf{
    position:absolute; inset:0; transform-style:preserve-3d;
    transition:transform var(--dur) cubic-bezier(.62,.02,.28,1);
    will-change:transform; backface-visibility:hidden;
  }
  .leaf.left{transform-origin:left center}
  .leaf.right{transform-origin:right center}

  .face{
    position:absolute; inset:0; backface-visibility:hidden;
    background-image:url('door-front.jpg');
    background-size:cover; background-position:center 38%;
    filter:saturate(.94) contrast(1.03) brightness(.94);
  }
  .leaf.left  .face{clip-path:inset(0 50% 0 0)}
  .leaf.right .face{clip-path:inset(0 0 0 50%)}

  /* 门背面 */
  .face.back{
    transform:rotateY(180deg); background-image:none;
    background:linear-gradient(160deg,#3d5c46 0%,#2a4534 45%,#16281d 100%);
    box-shadow:inset 0 0 140px rgba(0,0,0,.55);
  }
  .face.back::after{content:''; position:absolute; inset:0; opacity:.35;
    background:repeating-linear-gradient(90deg,transparent 0 90px,rgba(255,255,255,.05) 90px 92px)}

  .hero.open .leaf.left{transform:rotateY(calc(var(--angle) * -1))}
  .hero.open .leaf.right{transform:rotateY(var(--angle))}
  .hero.open .inside{transform:scale(1.03)}

  /* 开门瞬间的光 */
  .flash{
    position:absolute; inset:0; z-index:4; pointer-events:none;
    background:radial-gradient(ellipse at 50% 50%,rgba(190,235,250,.9),rgba(190,235,250,0) 55%);
    opacity:0;
  }
  .hero.open .flash{animation:flash 1.05s ease forwards}
  @keyframes flash{0%{opacity:0}16%{opacity:.6}100%{opacity:0}}

  /* 暗角 */
  .vignette{
    position:absolute; inset:0; z-index:3; pointer-events:none; opacity:1;
    transition:opacity .9s ease;
    background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 38%,rgba(4,14,20,.55) 100%),
               linear-gradient(180deg,rgba(4,14,20,.45),rgba(4,14,20,0) 22%,rgba(4,14,20,0) 72%,rgba(4,14,20,.6));
  }
  .hero.open .vignette{opacity:0}

  /* 提示 */
  .hint{
    position:absolute; left:50%; bottom:var(--hint-bottom); z-index:6;
    transform:translateX(-50%);
    color:#fff; font-size:.9rem; letter-spacing:.2em; white-space:nowrap;
    display:flex; align-items:center; gap:10px; cursor:pointer;
    text-shadow:0 2px 10px rgba(0,0,0,.75);
    animation:bob 2.2s ease-in-out infinite; transition:opacity .35s;
  }
  .hero.open .hint{opacity:0; pointer-events:none}
  @keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-6px)}}

  .replay{
    position:fixed; right:calc(env(safe-area-inset-right) + 14px);
    bottom:calc(env(safe-area-inset-bottom) + 14px); z-index:20;
    min-height:40px; padding:0 14px; border-radius:8px;
    background:rgba(255,255,255,.14); color:#fff; font-size:.82rem;
    border:1px solid rgba(255,255,255,.32); backdrop-filter:blur(6px);
    -webkit-appearance:none;
  }

  /* ---------- 手机（竖屏）适配 ---------- */
  @media (max-width: 640px){
    :root{
      --dur: 1.15s;
      --angle: 100deg;
      --persp: 1500px;
      --pad-x: 22px;
      --h1: 1.72rem;
      --body: .95rem;
      --hint-bottom: calc(env(safe-area-inset-bottom) + 34px);
    }
    .inside h1{margin-bottom:14px}
    .inside p{margin-bottom:22px; line-height:1.7}
    .btns{gap:10px}
    .btn{flex:1 1 0; padding:0 14px; font-size:.95rem}
    .hint{font-size:.8rem; letter-spacing:.14em}
    .face{background-position:center 40%}
  }

  /* 小屏（iPhone SE / 老旧安卓）再收一档 */
  @media (max-width: 375px){
    :root{--h1:1.5rem; --body:.9rem; --pad-x:18px}
  }

  /* 横屏：裁切方向相反，稍微拉远一点视觉重心 */
  @media (orientation: landscape) and (max-height: 500px){
    :root{--h1:clamp(1.2rem, 3.2vw, 1.7rem); --body:.85rem; --pad-x:6vw; --angle:96deg; --dur:1.1s}
    .inside{padding-top:calc(env(safe-area-inset-top) + 10px); padding-bottom:calc(env(safe-area-inset-bottom) + 10px)}
    .inside p{display:none}
    .hint{bottom:calc(env(safe-area-inset-bottom) + 14px)}
  }

  @media (prefers-reduced-motion: reduce){
    :root{--dur:.01s}
    .hint{animation:none}
    .hero.open .flash{animation:none}
  }
</style>
</head>
<body>
<section class="hero" id="hero">
  <div class="inside">
    <h1>以人力资源为核心，<br>助力企业在<em>香港高效扩张</em></h1>
    <p>升捷發展有限公司将人力资源与劳务外包作为主营方向，专注为雇主解决在港招聘、培训与合规的高额成本与管理负担。</p>
    <div class="btns">
      <a class="btn" href="#">探索服务</a>
      <a class="btn ghost" href="#">立即咨询</a>
    </div>
  </div>

  <div class="leaf left">
    <div class="face front"></div>
    <div class="face back"></div>
  </div>
  <div class="leaf right">
    <div class="face front"></div>
    <div class="face back"></div>
  </div>

  <div class="flash"></div>
  <div class="vignette"></div>
  <div class="hint" id="hint">轻点开门 <span style="font-size:1.05rem">↓</span></div>
</section>
<button class="replay" id="replay">重播</button>

<script>
(function(){
  var hero = document.getElementById('hero');
  var opened = false;

  function open(){ if(opened) return; opened = true; hero.classList.add('open'); try{sessionStorage.setItem('heroOpened','1')}catch(e){} }
  function close(){ opened = false; hero.classList.remove('open'); }

  // 点击 / 轻点
  hero.addEventListener('click', open);
  // 键盘
  window.addEventListener('keydown', open);
  // 滚轮（桌面）
  window.addEventListener('wheel', open, {passive:true, once:true});
  // 上滑（手机）
  var y0 = null;
  hero.addEventListener('touchstart', function(e){ y0 = e.touches[0].clientY; }, {passive:true});
  hero.addEventListener('touchmove', function(e){
    if (y0 !== null && y0 - e.touches[0].clientY > 24) open();
  }, {passive:true});

  document.getElementById('replay').addEventListener('click', function(e){
    e.stopPropagation(); close(); setTimeout(open, 320);
  });

  var seen = false;
  try { seen = sessionStorage.getItem('heroOpened') === '1'; } catch(e){}
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (seen || reduce) open();
  else setTimeout(open, 750);

  window.__doors = { open: open, close: close };
})();
</script>
</body>
</html>
